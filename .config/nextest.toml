# cargo-nextest configuration. Two profiles, same set of tests:
#   default — local runs (`cargo nextest run --workspace`)
#   ci      — the GitHub `test` job (identical tests, more reporting)
#
# nextest does NOT run doc-tests; the workflow and the verification gate run
# `cargo test --workspace --doc` alongside nextest to keep them. `#[ignore]`d
# tests (at_rest_dmcrypt, reticulum_spike, the golden-schema regenerator) stay
# ignored here exactly as under `cargo test`; `--run-ignored ignored-only`
# opts into them. Needs nextest >= 0.9.90 for the `[profile.*.junit]` table.

[profile.default]
retries = 0
fail-fast = false
# Warn on tests slower than this; never terminate them. `slow-timeout` has no
# `terminate-after`, on purpose: a slow test is a finding to report, not a
# failure to kill (the whole point of the test-perf work).
slow-timeout = { period = "30s" }
status-level = "slow"
final-status-level = "slow"

[profile.default.junit]
# Written under target/nextest/default/junit.xml.
path = "junit.xml"
store-success-output = false

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "30s" }
status-level = "pass"
final-status-level = "slow"

[profile.ci.junit]
# Written under target/nextest/ci/junit.xml.
path = "junit.xml"
store-success-output = false
store-failure-output = true

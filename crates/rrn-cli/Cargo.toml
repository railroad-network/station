[package]
name = "rrn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Railroad Network rrn CLI: the operator console (a thin client over the station's Unix socket), the verify-only paper courier tools, and the self-custody member wallet (ADR-0028)."

[[bin]]
name = "rrn"
path = "src/main.rs"

[dependencies]
# The CLI shares the wire types and Unix-socket client with the daemon rather
# than redefining them, so the two cannot drift (see T0.6.3's "shared types"
# note). It pulls in only the `rpc` / `rpc_client` surface.
rrn-station = { path = "../rrn-station", version = "0.1" }

# The paper tools decode and *verify* paper-carried payloads locally — QR text
# is untrusted courier input, so `rrn paper show`/`ingest` check every signature
# before display — and the member wallet (`rrn wallet`, ADR-0028) signs its own
# records. The operator console holds no key and opens no database; the paper
# courier tools hold no key and open no database; only the `wallet` family does
# both, over its own wallet home. These crates are linked directly, though they
# already come in transitively through `rrn-station`.
rrn-protocol = { path = "../rrn-protocol", version = "0.1" }
rrn-ledger = { path = "../rrn-ledger", version = "0.1" }
rrn-crypto = { path = "../rrn-crypto", version = "0.1" }
rrn-identity = { path = "../rrn-identity", version = "0.1" }
# The self-custody member wallet (`rrn wallet`, ADR-0028) holds a key and its own
# outbox database — the one CLI role that does. It reuses the on-station
# `OutboxStore`/`WalletMeta` over its own `wallet.db` rather than a second
# implementation, so the chain-integrity rules cannot drift.
rrn-storage = { path = "../rrn-storage", version = "0.1" }
# The wallet signs governance ballots offline (ADR-0028); it builds the `Vote`
# record locally, exactly as it does a proposal or dispute.
rrn-governance = { path = "../rrn-governance", version = "0.1" }
# Peeking the `kind` discriminator and decoding the house `{signer,sig,body}`
# envelope for `paper show` — the canonical CBOR model (ADR-0002).
dcbor = "0.25"
# QR rendering. `default-features = false` avoids the `image` tree — the PNG and
# PDF writers in `paper.rs` are hand-rolled over the raw module matrix so no
# compression/imaging dependency enters the audit surface (matches the
# no-default-features use in `rrn-station`'s recovery-shard QR).
qrcode = { version = "0.14", default-features = false }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
clap = { version = "4", features = ["derive"] }
# Hidden passphrase entry for the member wallet (`rrn wallet`, ADR-0028): never
# echoed, never taken on argv. Already in the workspace via `rrn-station`.
rpassword = "7"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "rrn-reputation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reputation for Railroad Network: transaction- and attestation-derived scores with time decay."

[dependencies]
# Signed attestations and canonical CBOR underlie every reputation input.
rrn-crypto = { path = "../rrn-crypto", version = "0.1" }
# Reputation state is materialized from, and cached in, local storage.
rrn-storage = { path = "../rrn-storage", version = "0.1" }
# Reputation is a property of an identity and is built from its attestations.
rrn-identity = { path = "../rrn-identity", version = "0.1" }
# Scores derive from confirmed/settled transaction history on the ledger.
rrn-ledger = { path = "../rrn-ledger", version = "0.1" }
# Profiles serialize to canonical CBOR for the snapshot cache and for
# the signed, portable history.
serde = { version = "1", features = ["derive"] }
dcbor = "0.25"
# Typed scoring/portability errors, and diagnostics for the refresh task.
thiserror = "1"
tracing = "0.1"

[features]
# Exposes `testutil` (the shared ADR-0038 standing helpers) to the test builds of
# downstream crates. Never enabled by a non-dev dependency.
test-util = []

[dev-dependencies]
# Property tests of the scoring rules (velocity cap, eligibility).
proptest = "1"
# The integration tests use the shared standing helpers (`testutil`).
rrn-reputation = { path = ".", version = "0.1", features = ["test-util"] }

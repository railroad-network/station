[package]
name = "rrn-marketplace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Marketplace for Railroad Network: goods/services listings, inquiries, and search."

[dependencies]
# Signed listings and canonical CBOR for their content-addressed ids.
rrn-crypto = { path = "../rrn-crypto", version = "0.1" }
# Persistence and the append-only log listings/inquiries are recorded in.
rrn-storage = { path = "../rrn-storage", version = "0.1" }
# Listers and inquirers are identities; listing authorship is an attestation.
rrn-identity = { path = "../rrn-identity", version = "0.1" }
# A completed sale settles as a mutual-credit transaction on the ledger.
rrn-ledger = { path = "../rrn-ledger", version = "0.1" }
# Provider standing ranks search results and bounds `min_reputation`; the
# reachable-composite ceiling it is validated against derives from ADR-0009's
# weights rather than a literal, so it moves as dimensions come online.
rrn-reputation = { path = "../rrn-reputation", version = "0.1" }
# Listings are canonical CBOR on the log (ADR-0002); serde for the derived
# index rows that never travel signed.
dcbor = "0.25"
serde = { version = "1", features = ["derive"] }
# Full-text relevance over title/description/category (T1.6.6). This index
# lives outside the log's SQLite transaction, so per ADR-0010 it is
# authoritative over nothing: rebuilt by replay, and deletion is the repair.
tantivy = "0.26"
# Typed validation/lifecycle errors, and diagnostics for the expiry sweep.
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
# The persistent tantivy index is exercised against a real directory, since
# open-write-reopen is the part an in-RAM index cannot check.
tempfile = "3"

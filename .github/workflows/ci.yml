name: CI

on:
  # A PR push runs this workflow once, via `pull_request`. Pushes to `main`
  # (post-merge) also run it, and additionally the `coverage` + `fuzz-smoke`
  # lanes that are held off the PR path. A push to a feature branch with no
  # open PR runs nothing — open a (draft) PR to get CI.
  push:
    branches: [main]
  pull_request:
  # Weekly deep lane + coverage + fuzz (see the `deep`/`coverage` jobs).
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  # Manual trigger for the non-hermetic `reticulum-spike` lane (ADR-0026), the
  # `deep` proptest lane, and coverage on demand.
  workflow_dispatch:

# One in-flight run per PR: a superseded PR push cancels its predecessor. Non-PR
# events (main pushes, schedule, dispatch) each get a unique group keyed on the
# run id, so they never cancel one another — a shared main group would cancel a
# still-pending run when a third is queued, losing a merged commit's CI record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Path filter used only to gate `fuzz-smoke` on PRs (see that job). `on.paths`
  # is workflow-wide, so this per-job filter is the way to scope one lane.
  changes:
    name: changes
    runs-on: ubuntu-latest
    # paths-filter only needs to read the PR's changed files.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v4
      # Only meaningful on a PR (it needs a base to diff against). On every
      # other event the step is skipped, `fuzz` resolves to empty, and
      # `fuzz-smoke` runs anyway via its `!= pull_request` clause.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            # Every crate compiled into the fuzz targets: fuzz/Cargo.toml's deps
            # (rrn-crypto, rrn-storage, rrn-identity, rrn-ledger) plus their
            # normal-dependency closure — rrn-ledger pulls in rrn-protocol.
            # (rrn-mobile-ffi is only a dev-dep of rrn-ledger, so it is not.)
            fuzz:
              - 'crates/rrn-crypto/**'
              - 'crates/rrn-storage/**'
              - 'crates/rrn-identity/**'
              - 'crates/rrn-ledger/**'
              - 'crates/rrn-protocol/**'
              - 'fuzz/**'
              - 'Cargo.lock'

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Share the compile cache with `deep` (identical build inputs), so the
          # weekly deep run does not cold-build after cache eviction.
          shared-key: test-suite
      # nextest overlaps test binaries (cargo test runs them serially) and
      # emits per-test times, a JUnit report, and slow-test warnings. Install
      # the prebuilt binary — `cargo install` here would cost 3-5 min/job.
      - uses: taiki-e/install-action@nextest
      # One shard: the warm `test` wall is ~2 min after the test-perf work
      # (nextest, optimized dependency profiles, single-replay scoring, kind
      # dispatch, proptest budgets), well under the 8-min budget, so
      # partitioning would only add scheduling overhead.
      # To shard later, add `strategy.matrix.partition: [1, 2, …]` and append
      # `--partition hash:${{ matrix.partition }}/${{ strategy.job-total }}`
      # here: nextest assigns tests by a stable hash of the test name, so the
      # shards are deterministic and their union is the full suite. Keep the
      # doc-test step below on `partition == 1` when you do.
      - run: cargo nextest run --workspace --all-features --profile ci
      # nextest does not run doc-tests; run them explicitly to keep coverage.
      - run: cargo test --workspace --all-features --doc
      - name: Slowest tests
        if: always()
        # Guard: a build failure leaves no JUnit; don't traceback over red.
        run: |
          if [ -f target/nextest/ci/junit.xml ]; then
            python3 scripts/ci/slowest-tests.py target/nextest/ci/junit.xml 20
          else
            echo "no JUnit report (nextest did not produce one)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  deep:
    name: deep (proptest 1024 cases)
    # The deep property lane: every proptest at 1024 cases (PROPTEST_CASES
    # overrides the fast per-test defaults, matching scripts/test-deep.sh).
    # Slow by design — schedule/dispatch only, never on the PR path.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "1024"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Reuse the `test` job's cache (same Cargo.lock, profile, features).
          shared-key: test-suite
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features --profile ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  fuzz-smoke:
    name: fuzz-smoke
    # Gates the audit-boundary crates. On a PR it runs only when a crate the
    # fuzz targets exercise (or Cargo.lock / fuzz/) changed; on `main`, the
    # schedule, and manual dispatch it always runs.
    needs: changes
    if: needs.changes.outputs.fuzz == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          cache-bin: true
      - run: cargo install cargo-fuzz --locked
      # Compile all targets, then run each as a 60s smoke check (not full
      # fuzzing — the ≥1h-per-target pass is the gated audit-prep workflow).
      # `-max_total_time` caps the work; a target that panics fails the job.
      - run: cargo +nightly fuzz build
      - run: cargo +nightly fuzz run verify_signature    -- -max_total_time=60
      - run: cargo +nightly fuzz run canonical_roundtrip -- -max_total_time=60
      - run: cargo +nightly fuzz run hash_chain          -- -max_total_time=60
      - run: cargo +nightly fuzz run log_replay          -- -max_total_time=60
      - run: cargo +nightly fuzz run state_machine       -- -max_total_time=60
      - run: cargo +nightly fuzz run shamir_reconstruct  -- -max_total_time=60
      - run: cargo +nightly fuzz run wallet_decrypt      -- -max_total_time=60
      - run: cargo +nightly fuzz run address_parse       -- -max_total_time=60

  reticulum-spike:
    name: reticulum-spike
    # Non-hermetic integration spike (ADR-0013 / ADR-0026): installs the
    # pinned Python Reticulum daemon + LXMF and runs the `#[ignore]`d spike that
    # carries a real signed Bundle across two supervised `rnsd` instances over
    # LXMF store-and-forward. Manual only (`workflow_dispatch`) — it needs a
    # network install and real processes, so it never gates a normal push/PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned Reticulum (rns 1.5.2 / lxmf 1.1.1)
        run: |
          python -m venv /tmp/rns
          /tmp/rns/bin/pip install --upgrade pip
          /tmp/rns/bin/pip install 'rns==1.5.2' 'lxmf==1.1.1'
          /tmp/rns/bin/rnsd --version
      - name: Run the Reticulum spike
        env:
          RRN_SPIKE_RNSD: /tmp/rns/bin/rnsd
          RRN_SPIKE_PYTHON: /tmp/rns/bin/python
        run: cargo test -p rrn-station --test reticulum_spike -- --ignored --nocapture

  at-rest-dmcrypt:
    name: at-rest-dmcrypt
    # The ADR-0024 encrypted-at-rest lane: exercises the REAL kernel dm-crypt path
    # (keyslot-less LUKS2 container, brick property on raw bytes, boot ceremony,
    # crash-safety, and the Station::open mount guard) plus the encrypted-profile
    # seizure-recovery drill. Needs cryptsetup, loop devices, and passwordless sudo
    # — all standard on GitHub-hosted ubuntu runners. This is the brick property's
    # only real verification (the macOS dev host has no dm-crypt), so it gates
    # push/PR rather than being manual. If it ever proves flaky for loop-device
    # reasons, move it behind `workflow_dispatch` and say so in the PR — do not
    # weaken the tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cryptsetup + load dm_crypt
        run: |
          sudo apt-get update
          sudo apt-get install -y cryptsetup-bin
          sudo modprobe dm_crypt
      - name: Preflight (fail loudly if the host cannot run dm-crypt)
        run: |
          set -euxo pipefail
          sudo -n true
          sudo losetup -f
          cryptsetup --version
      - name: Run the encrypted-at-rest integration tests
        # `--ignored` is the opt-in; the tests themselves panic if a prerequisite is
        # missing (no silent skip). Tee the output and assert a non-zero test count,
        # so the lane cannot quietly become a no-op.
        run: |
          set -euo pipefail
          cargo test -p rrn-station --test at_rest_dmcrypt -- --ignored --nocapture | tee /tmp/dmcrypt.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' /tmp/dmcrypt.log
      - name: Run the encrypted-profile seizure-recovery drill
        run: ./scripts/drill-seizure-recovery.sh --profile encrypted

  coverage:
    name: coverage
    # Held off the PR path (maintainer decision 2026-09-14): runs on `main`
    # pushes, the weekly schedule, and manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@cargo-llvm-cov
      # LLVM source-based instrumentation (same engine tarpaulin used via
      # --engine llvm, chosen because the ptrace engine times out on the
      # multi-threaded tokio e2e tests), driven by nextest so binaries run in
      # parallel. `--no-report` runs the suite once and keeps the profraw; the
      # two `report` calls then emit LCOV + HTML without re-running tests.
      - run: cargo llvm-cov nextest --workspace --all-features --profile ci --no-report
      # --html --output-dir creates the directory; --lcov --output-path does a
      # bare write and would fail if target/coverage/ did not exist yet, so run
      # the HTML report first.
      - run: cargo llvm-cov report --html --output-dir target/coverage
      - run: cargo llvm-cov report --lcov --output-path target/coverage/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/coverage/
